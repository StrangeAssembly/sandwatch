id: egress-expand
name: Network fan-out / service discovery
severity: medium
stage: egress
attack: [T1046, T1018]
description: >
  Connection attempts to many distinct destinations in a short time, several of which are
  refused, unreachable or time out. That is what scanning for reachable services looks like.
false_positive_notes: >
  Package managers connect to many CDN addresses, but those connections succeed. DNS
  (port 53) and loopback are excluded.
  ENETUNREACH does not count as a failed probe: a host without an IPv6 route fails every
  IPv6 address of a dual-stack service (e.g. PyPI's CDN) before falling back to IPv4.
match:
  class: network
  activities: [Open]
  dst_port_none: [53]
  dst_ip_none: ['127.0.0.0/8', '::1']
aggregate:
  min_distinct: 8
  min_failures: 3
  failure_errnos: [ECONNREFUSED, EHOSTUNREACH, ETIMEDOUT, EACCES, EPERM]
  window_s: 60
