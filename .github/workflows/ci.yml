name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and libbpf (eBPF program build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev

      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal -c clippy
          rustup default 1.88

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build (includes compiling the eBPF program)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --workspace --locked

      - name: Clippy
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings

      - name: Recordings, verifier parity and eval gate
        run: bash scripts/ci-check-recordings.sh target/release/sandwatch
