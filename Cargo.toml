[workspace]
members = ["crates/swrec", "crates/catena", "crates/sensor", "crates/sandwatch"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/OWNER/sandwatch"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

swrec = { path = "crates/swrec" }
catena = { path = "crates/catena" }

[profile.release]
lto = "thin"
codegen-units = 4
